<!-- 🐶 Créé un array langageList initialisée avec les 3 valeurs "html", "css" , "js"   -->

<!-- 🐶 Ajoute les 3 valeurs "java" , "python" et "c++" avec push  -->
<!--   📑 https://developer.mozilla.org/fr/docs/Web/JavaScript/Reference/Global_Objects/Array/push -->

<!-- 🐶 Logue ensuite toutes les valeurs du tableau avec une boucle for -->
<!--   📑 https://www.w3schools.com/js/js_loop_for.asp -->

<!-- 🐶 Remplace la valeur "html" par "html5" -->
<!--   🤖 langageList[index] = "new valeur" -->

<!-- 🐶 Supprime le dernier élément du tableau avec splice   -->
<!--   📑 https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/splice -->

<!doctype html>
<html>
  <body>
    <h1>voir la console</h1>
    <script>
      //démarre ici
      const langageList = ["hmtl", "css", "js"]
      langageList.push("java")
      langageList.push("python")
      langageList.push("c++")

      for (const langage of langageList) {
        console.log(langage)
      }
      //langageList.forEach((e) => console.log(e))
      langageList[0] = "html5"
      //langageList.pop()
      langageList.splice(langageList.length - 1, 1)
      console.log(langageList)
    </script>
  </body>
</html>
