<!-- http://localhost:3000/alone/exercise/08.html -->

<!doctype html>
<html>
  <body>
    <div id="root">
      <h1 id="title"></h1>
    </div>

    <script>
      // 🐶 Récupère l'élement h1 et change son texte par Hello Worlkd
      //  🤖 document.getElementById("title").innerHTML
      document.getElementById("title").innerHTML = "Welcome"

      // 🐶 Créé ensuite un nouveau element h2 et socke cet élement dans une variable "newH2"
      //  🤖 document.createElement
      const newh2 = document.createElement("h2")
      newh2.innerText = "Introduction"
      document.getElementById("root").appendChild(newh2)

      const para = document.createElement("p")
      para.innerText = "Ceci est un paragraphe"
      document.getElementById("root").appendChild(para)

      // const footer = document.createElement("footer")
      // footer.innerText = "Site créé par ..."
      // document.getElementById("root").appendChild(footer)

      // 🐶 Ajoute ensuite le text "Introduction"

      // 🐶 Ajoute ensuite ce nouvel element dans la div root
      //  🤖 document.getElementById("root")
      //  🤖 .appendChild()

      // 🐶 Créé ensuite un nouveau element <p> avec le texte "Ceci est un paragraphe" et ajoute le dans la div root

      // 🐶 Créé ensuite un nouveau element <footer> avec le texte "Site créé par .." et ajoute le dans la div root

      // 🚀 La suite est dans la section bonus
      const langages = ["html", "css", "js"]

      const newUl = document.createElement("ul")
      document.getElementById("root").appendChild(newUl)

      // for (let i = 0; i < langages.length; i++) {
      //   const list = document.createElement("li")
      //   list.innerText = langages[i]
      //   newUl.appendChild(list)
      // }

      langages.map((e) => {
        const list = document.createElement("li")
        list.innerText = e
        newUl.appendChild(list)
      })

      var styleAttr = document.createAttribute("style")
      styleAttr.value = "background-color:powderblue"
      document.getElementById("root").setAttributeNode(styleAttr)
    </script>
  </body>
</html>
