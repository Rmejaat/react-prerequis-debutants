<!doctype html>
<html>
  <body>
    <div id="root">
      <h1 id="title">Pas d'information</h1>
      <!-- 🐶 Créé un bouton avec attribut onclick qui fait appelle à la fonction handleClick()-->
      <!-- 🤖 <button onclick="handleClick()">Click me</button> -->
      <button onclick="handleClick()" onmouseover="handleClick()">
        Click me
      </button>
      <div style="background-color: lightblue" onmouseenter="handleClick()">
        entre ici
      </div>
      <div style="background-color: lightcoral" onmouseleave="handleClick()">
        entre ici
      </div>
    </div>
    <script>
      // 🐶 Créé une fonction handleClick() et déclare 2 variables date et time

      const handleClick = () => {
        const date = new Date().toLocaleDateString()
        const time = new Date().toLocaleTimeString()

        const label = `Nous sommes le : ${date}, il est ${time}`

        document.getElementById("title").innerText = label
      }

      function handlePress(event) {
        var name = event.key
        var code = event.code
        console.log("name " + name + " : code " + code)

        if (name == "Enter" || name == "ArrowDown" || name == "ArrowUp") {
          handleClick()
        }
      }
      document.addEventListener("keydown", handlePress)
      // removeEventListener pour supprimer le listner

      // 🤖 var date = new Date().toLocaleDateString() et
      // var time = new Date().toLocaleTimeString()
      // 📑 https://www.w3schools.com/jsref/jsref_tolocaledatestring.asp
      //
      // 🐶 créé ensuite une variable `label` qui sera une concaténation
      // "Nous sommes le : `date` il est `time`"
      //
      // 🐶 mets à jour l'élément h1 avec `label`
      // utilise document.getElementById et innerText

      // 🚀 La suite est dans la section bonus
    </script>
  </body>
</html>
