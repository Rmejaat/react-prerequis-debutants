<!doctype html>
<html>
  <body>
    <h1>voir la console</h1>
    <script>
      //démarre ici
      const person = {
        nom: "Doe",
        premon: "John",
        age: 21,
        adresse: "New York",
        langages: ["html", "css", "js"],
      }

      console.log(person)

      person.ville = "paris"
      person.rue = 17
      person.frameworks = ["React", "Angular", "Vue"]

      for (const key in person) {
        console.log(person[key])
      }

      person.somme = (num1, num2) => {
        return num1 + num2
      }

      console.log(person.somme(4, 6))
    </script>
